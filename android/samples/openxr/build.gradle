plugins {
    id 'com.android.application' version '8.6.1'
}

// Assets are produced by the desktop build (matc/filamesh/cmgen) and copied in here, because the
// Android build does not compile samples/.
def desktopBuildDir = file("${rootDir}/../../../out/cmake-xr/samples")

android {
    namespace 'com.google.android.filament.openxr'
    compileSdk 34
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId 'com.google.android.filament.openxr'
        // OpenXR on Android requires the loader's Activity-aware initialization path.
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildFeatures {
        prefab true
    }

    // Filament loads these straight out of the APK, so they must not be compressed.
    androidResources {
        noCompress 'filamat', 'filamesh', 'ktx'
    }

    sourceSets {
        main {
            assets.srcDirs += "${buildDir}/generated/filamentAssets"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.41'
}

// Pull the mesh and IBL produced by the desktop build into the APK. Both are platform independent.
tasks.register('collectFilamentAssets', Copy) {
    into layout.buildDirectory.dir('generated/filamentAssets')

    from("${desktopBuildDir}/generated/resources") {
        include 'suzanne.filamesh'
    }
    from("${desktopBuildDir}/assets/ibl/lightroom_14b") {
        include '*.ktx'
    }

    doFirst {
        if (!desktopBuildDir.exists()) {
            throw new GradleException(
                    "Desktop build output not found at ${desktopBuildDir}. Build the desktop " +
                    "samples first so filamesh/cmgen artifacts exist.")
        }
    }
}

// The material has to be recompiled rather than copied: the desktop build targets `-p desktop`,
// which contains no mobile shaders, and it must carry the multiview variants.
tasks.register('compileMaterial', Exec) {
    def matc = file("${rootDir}/../../../out/cmake-xr/tools/matc/matc" +
            (System.getProperty('os.name').toLowerCase().contains('windows') ? '.exe' : ''))
    def source = file("${rootDir}/../../../samples/materials/aiDefaultMat.mat")
    def output = layout.buildDirectory.file('generated/filamentAssets/aiDefaultMat.filamat')

    inputs.file source
    outputs.file output

    doFirst {
        if (!matc.exists()) {
            throw new GradleException("matc not found at ${matc}. Build the desktop tools first.")
        }
        output.get().asFile.parentFile.mkdirs()
    }

    commandLine matc.absolutePath,
            '-a', 'vulkan',
            '-p', 'mobile',
            '-PstereoscopicType=multiview',
            '-o', output.get().asFile.absolutePath,
            source.absolutePath
}

tasks.configureEach { task ->
    if ((task.name.startsWith('generate') || task.name.startsWith('merge')) &&
            task.name.endsWith('Assets')) {
        task.dependsOn 'collectFilamentAssets', 'compileMaterial'
    }
}
